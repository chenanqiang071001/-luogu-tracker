<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><meta name="description" content="洛谷八周C++与数据结构刷题打卡器"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>洛谷刷题打卡</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div><div class="eyebrow">C++ · STL · 数据结构</div><h1>洛谷刷题打卡 <span>✦</span></h1><p>八周循序渐进 · 记录每一次进步</p></div><button id="install" class="ghost" hidden>安装到桌面</button></header><section class="summary"><div><small>已完成任务</small><strong id="totalDone">0 / 0</strong></div><div><small>整体进度</small><strong id="percent">0%</strong></div><div><small>已完成周数</small><strong id="weekDone">0 / 8</strong></div><div class="bar"><div id="progressBar"></div></div></section><section class="panel"><div class="panelhead"><h2>学习周次</h2><span>按周切换</span></div><nav id="weeks" class="weeks" aria-label="选择学习周"></nav><div class="weekhead"><div><div id="weekLabel" class="eyebrow"></div><h2 id="weekTitle"></h2><p id="weekFocus"></p></div><span class="count" id="weekCount"></span></div><div id="tasks" class="tasks"></div><label for="note">本周错题与学习笔记</label><textarea id="note" rows="4" placeholder="记录思路、错误原因、需要复习的知识点……"></textarea><div class="navbuttons"><button id="prev" class="ghost">← 上一周</button><button id="next">下一周 →</button></div></section><section class="panel"><h2>学习进度</h2><div id="stats" class="stats"></div><p class="hint">重复出现的题目是刻意安排的复做训练，每次复做单独计入任务。</p></section><section class="panel"><h2>备份与恢复</h2><p class="hint">打卡数据自动保存在当前浏览器。换设备或清理浏览器数据前，请导出备份。</p><div class="actions"><button id="export">导出 JSON 备份</button><label class="upload" for="importFile">导入 JSON 备份<input type="file" id="importFile" accept="application/json,.json" hidden></label></div><p id="message" role="status" aria-live="polite"></p></section><footer>离线可查看题单和记录 · 打开洛谷题目需要网络</footer></main><script src="./app.js" defer></script></body></html>
